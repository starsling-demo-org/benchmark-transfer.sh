name: test
on:
  # bench-only: run on each PR into starsling/develop; no push trigger.
  pull_request:
    branches:
      - starsling/develop
jobs:
  test:
    runs-on: starsling-ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        go_version:
          - '1.26'
          - '1.27'
          - tip
    name: Test with ${{ matrix.go_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Go ${{ matrix.go_version }}
        if: ${{ matrix.go_version != 'tip' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}
          check-latest: true
      - name: Install bootstrap Go for tip
        if: ${{ matrix.go_version == 'tip' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Find Go tip's commit
        if: ${{ matrix.go_version == 'tip' }}
        id: tip
        run: echo "sha=$(git ls-remote https://go.googlesource.com/go HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Go tip
        if: ${{ matrix.go_version == 'tip' }}
        id: tip-cache
        uses: actions/cache@v4
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ runner.arch }}-${{ steps.tip.outputs.sha }}
      - name: Install Go ${{ matrix.go_version }}
        if: ${{ matrix.go_version == 'tip' }}
        run: |
          go install golang.org/dl/gotip@latest
          if [ "${{ steps.tip-cache.outputs.cache-hit }}" != "true" ]; then `go env GOPATH`/bin/gotip download; fi
      - name: Vet and test no tip
        if: ${{ matrix.go_version != 'tip' }}
        run: |
          go version
          go vet ./...
          go test ./...
      - name: Vet and test gotip
        if: ${{ matrix.go_version == 'tip' }}
        run: |
          `go env GOPATH`/bin/gotip version
          `go env GOPATH`/bin/gotip vet ./...
          `go env GOPATH`/bin/gotip test ./...
  golangci:
    name: Linting
    runs-on: starsling-ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: "--config .golangci.yml"
